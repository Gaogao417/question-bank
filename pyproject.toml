[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teaching-question-bank"
version = "0.1.0"
description = "Independent PostgreSQL question bank, review UI and agent ingestion tools"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "Pillow>=11,<13",
    "PyYAML>=6,<7",
    "python-multipart>=0.0.20",
    "oss2>=2.18",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
question-bank = "question_bank.cli:main"
question-bank-agent = "question_bank.agent_tools:main"
question-bank-extract-docx = "question_bank.docx_source:main"

[tool.setuptools.packages.find]
include = ["question_bank*"]

[tool.setuptools.package-data]
question_bank = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
