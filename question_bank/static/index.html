<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>题库管理 · 数据库修订</title>
    <link rel="stylesheet" href="/static/question-bank-review.css?v=20260930-wizard-2">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        startup: { typeset: false }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
    <script defer src="/static/app.js?v=20260930-wizard-2"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">QUESTION BANK · MANAGE</p>
        <h1>题库管理</h1>
        <p class="subtitle">左边看题与编辑，右边逐条回应疑点、汇总修改要求后交给 AI。</p>
      </div>
      <div class="summary" aria-live="polite">
        <span id="root-summary">—</span>
        <span id="topic-summary">尚未选择</span>
        <span><strong id="position-summary">—</strong></span>
      </div>
    </header>

    <main>
      <section class="toolbar bank-picker" aria-label="试卷选择">
        <div class="filter-row">
          <label class="filter-field">
            <span>年级</span>
            <select id="filter-grade" autocomplete="off" disabled>
              <option value="">全部</option>
            </select>
          </label>
          <label class="filter-field">
            <span>年份</span>
            <select id="filter-year" autocomplete="off" disabled>
              <option value="">全部</option>
            </select>
          </label>
          <label class="filter-field">
            <span>试卷类型</span>
            <select id="filter-exam-type" autocomplete="off" disabled>
              <option value="">全部</option>
              <option value="一模">一模</option>
              <option value="二模">二模</option>
              <option value="期中">期中</option>
              <option value="期末">期末</option>
              <option value="中考">中考</option>
            </select>
          </label>
          <label class="filter-field filter-field-search">
            <span>检索试卷</span>
            <input id="search-input" type="search" placeholder="题库名 / 年份 / 区…" autocomplete="off">
          </label>
          <label class="filter-field filter-field-bank">
            <span>选择试卷</span>
            <select id="bank-select" disabled><option value="">正在加载…</option></select>
          </label>
        </div>
        <div class="bank-meta" id="bank-meta">读取管理根下的数据库题库</div>
      </section>

      <p id="page-status" class="page-status" role="status">正在加载…</p>
      <section id="review-layout" class="review-layout" hidden>
        <aside class="question-panel" aria-label="题目列表">
          <header class="panel-header">
            <div><p class="eyebrow">ITEMS</p><h2>题目列表</h2></div>
            <span id="item-count">—</span>
          </header>
          <input id="item-filter" type="search" placeholder="筛题号 / item_id…" autocomplete="off" aria-label="卷内题号筛选">
          <div id="question-list" class="question-list"></div>
        </aside>

        <article class="reader" id="reader" aria-live="polite">
          <header class="reader-header">
            <div><p class="eyebrow" id="item-id">—</p><h2 id="item-title">选择一道题</h2></div>
            <div id="item-badges" class="badges"></div>
          </header>
          <div id="load-error" class="load-error" hidden></div>
          <div id="item-skeleton" class="qbm-skeleton" hidden aria-hidden="true">
            <div class="qbm-skeleton-title"></div>
            <div class="qbm-skeleton-line"></div>
            <div class="qbm-skeleton-line"></div>
            <div class="qbm-skeleton-line short"></div>
          </div>
          <div id="stale-banner"></div>



          <section class="reader-section">
            <div class="section-head"><h3>题目</h3><div id="source-capsules" class="source-capsules"></div></div>
            <button id="edit-stem" type="button" class="ghost-button qbm-edit-button">编辑</button>
            <div id="stem" class="source-text"></div>
            <div id="editor-stem" class="qbm-editor">
              <textarea aria-label="编辑题干" id="editor-stem-text" rows="8" spellcheck="false"></textarea>
            </div>
          </section>

          <section class="reader-section image-section">
            <div class="section-head">
              <h3>题图</h3>
            </div>
            <div id="prompt-preview" class="preview-well"></div>
          </section>

          <section class="answer-card">
            <div class="reader-section">
              <button id="edit-answer" type="button" class="ghost-button qbm-edit-button">编辑</button>
              <h3>答案</h3>
              <div id="answer" class="source-text answer-text"></div>
              <div id="editor-answer" class="qbm-editor">
                <textarea aria-label="编辑答案" id="editor-answer-text" rows="4" spellcheck="false"></textarea>
              </div>
            </div>
            <div class="reader-section">
              <button id="edit-solution" type="button" class="ghost-button qbm-edit-button">编辑</button>
              <h3>解答</h3>
              <div id="solution" class="source-text"></div>
              <div id="editor-solution" class="qbm-editor">
                <textarea aria-label="编辑解答" id="editor-solution-text" rows="8" spellcheck="false"></textarea>
              </div>
            </div>
          </section>

          <section class="reader-section image-section">
            <div class="section-head">
              <h3>解答图</h3>
            </div>
            <div id="solution-preview" class="preview-well"></div>
          </section>



          <section id="explanations-card" class="reader-section explanations-card" aria-label="小题讲解与解答">
            <div class="section-head">
              <div><p class="eyebrow">TEACHING NOTES</p><h3>讲解 / 解答（小题）</h3></div>
              <span id="explanations-summary"></span>
            </div>
            <div class="explanations-actions">
              <button id="fill-explanations" type="button" class="ghost-button">补齐缺失讲解</button>
              <button id="fill-solutions" type="button" class="ghost-button">补齐缺失解答</button>
              <button id="export-blueprints" type="button" class="approve-button">导出 blueprint 批次</button>
            </div>
            <p id="explanations-hint" class="explanations-hint"></p>
            <p id="explanations-message" class="explanations-message" role="status"></p>
            <div id="explanations-body" class="explanations-body"></div>
          </section>





          <nav class="reader-nav" aria-label="逐题浏览">
            <button id="previous-item" type="button"><kbd>←</kbd> 上一题</button>
            <button id="next-item" type="button">下一题 <kbd>→</kbd></button>
          </nav>
        </article>
<aside id="review-sidebar" class="review-sidebar" aria-label="审阅与修订">
  <header class="sidebar-heading"><h2>本题审阅</h2><span id="review-status" class="review-status">待审核</span></header>
  <div class="sidebar-content">
    <div id="save-dock"></div>
    <section id="assist-flow" class="assist-flow" aria-label="修改要求"></section>
    <section id="proposals-section" class="assist-proposals" hidden>
            <div class="section-head">
              <div><h3>AI 修改结果</h3></div>
              <span id="proposals-summary"></span>
            </div>
            <div id="proposal-list"></div>
          </section>
    <details class="sidebar-disclosure more-operations">
      <summary>更多操作</summary>
      <div class="sidebar-secondary">
        <details class="sidebar-disclosure"><summary>发布与导出<span id="publication-status" class="review-status">未发布</span></summary>
          <div class="qbm-manage-actions">
              <button id="export-item" type="button" class="ghost-button">导出当前修订</button>
              <button id="export-draft" type="button" class="ghost-button">导出草稿预览</button>
              <button id="publish-item" type="button" class="approve-button">发布当前修订</button>
              <button id="withdraw-item" type="button" class="reject-button">撤回发布</button>
            </div>
        </details>
        <details class="sidebar-disclosure"><summary>版本历史</summary><div id="revision-history-wrap"></div></details>
        <details class="sidebar-disclosure"><summary>全卷操作</summary>
          <button id="approve-paper" type="button" class="ghost-button bulk-button" title="快捷键 Shift+A">全卷通过并跳转下一卷</button>
          <p id="bulk-message" class="review-message" role="status"></p>
        </details>
      </div>
    </details>
  </div>
  <section id="review-card" class="sidebar-footer" aria-label="审核">
    <p id="review-blocker" class="sidebar-blocker" role="status"></p>
    <p id="manage-message" class="review-message" role="status"></p>
    <p id="review-message" class="review-message" role="status"></p>
    <div class="review-actions">
      <button id="reject-item" type="button" class="ghost-button" title="快捷键 R">要求修改</button>
      <button id="approve-item" type="button" class="approve-button" title="快捷键 A">通过本题</button>
    </div>
  </section>
</aside>
      </section>
    </main>

    <dialog id="revision-dialog" class="review-dialog" aria-labelledby="revision-dialog-title">
      <form id="revision-form" class="review-dialog-form" novalidate>
        <div>
          <p class="eyebrow">REVISION REQUEST</p>
          <h2 id="revision-dialog-title">填写修改意见</h2>
          <p id="revision-item-label" class="dialog-subtitle"></p>
        </div>
        <label for="revision-note"><span>需要修改什么？</span></label>
        <textarea id="revision-note" rows="6" maxlength="4000" required
          placeholder="请写明漏图、转写、公式、裁切或解答中的具体问题"></textarea>
        <p id="revision-error" class="revision-error" role="alert"></p>
        <p class="dialog-shortcut">按 <kbd>Esc</kbd> 取消，<kbd>Ctrl/⌘</kbd> + <kbd>Enter</kbd> 提交</p>
        <div class="dialog-actions">
          <button id="cancel-revision" type="button">取消</button>
          <button id="confirm-revision" type="submit" class="reject-button">确认要求修改</button>
        </div>
      </form>
    </dialog>

    <dialog id="source-lightbox" class="review-dialog source-lightbox" aria-labelledby="source-lightbox-title">
      <div class="source-lightbox-frame">
        <header class="source-lightbox-header">
          <div><p class="eyebrow">SOURCE</p><h2 id="source-lightbox-title">来源</h2></div>
          <button id="source-lightbox-close" type="button" class="source-lightbox-close" aria-label="关闭">✕</button>
        </header>
        <div class="source-lightbox-stage">
          <button id="source-lightbox-prev" type="button" class="source-lightbox-nav" aria-label="上一张">◀</button>
          <a id="source-lightbox-open" class="source-lightbox-open" href="#" target="_blank" rel="noopener" title="在新页打开原图">
            <img id="source-lightbox-image" alt="">
          </a>
          <button id="source-lightbox-next" type="button" class="source-lightbox-nav" aria-label="下一张">▶</button>
        </div>
        <footer class="source-lightbox-footer">
          <span id="source-lightbox-caption" class="source-lightbox-caption"></span>
          <span id="source-lightbox-counter" class="source-lightbox-counter"></span>
        </footer>
      </div>
    </dialog>

    <div id="conflict-backdrop" class="qbm-conflict-backdrop">
      <div class="qbm-conflict" id="conflict-body"></div>
    </div>
  </body>
</html>
